name: Chaos Testing

on:
  workflow_call:

permissions:
  contents: read

jobs:
  run-chaos-tests:
    name: run chaos tests
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: false
          load: true
          context: src/
          file: src/tester/Dockerfile
          build-contexts: |
            fixtures=tests/chaos/tester
          tags: |
            ghcr.io/open-recruit/recruit/tester:v1

      - name: Create KinD cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: kind

      - name: Load images into KinD
        run: |
          kind load docker-image ghcr.io/open-recruit/recruit/tester:v1

      - name: List images in cluster
        run: docker exec kind-control-plane crictl images

      - name: Install chaos testing prerequisites
        working-directory: tests/chaos
        run: |
          curl -sL -o - https://github.com/argoproj/argo-workflows/releases/download/v3.4.3/argo-linux-amd64.gz | gunzip > argo
          chmod +x ./argo

          kubectl create ns recruit
          kubectl apply -f https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.18/releases/cnpg-1.18.0.yaml

          kubectl wait --for=condition=ready pod \
            -n cnpg-system \
            --selector='app.kubernetes.io/name=cloudnative-pg' \
            --timeout=5m

          kubectl apply -f cnpg.yaml -n recruit

          helm repo add chaos-mesh https://charts.chaos-mesh.org
          helm upgrade --install chaos-mesh chaos-mesh/chaos-mesh \
            --create-namespace \
            -n chaos-mesh \
            --set chaosDaemon.runtime=containerd \
            --set chaosDaemon.socketPath='/run/containerd/containerd.sock' \
            --version 2.4.3

          kubectl apply -f chaos-mesh-rbac.yaml

          helm repo add argo https://argoproj.github.io/argo-helm
          helm upgrade --install argo-workflows argo/argo-workflows \
              --create-namespace \
              -n argo-workflows \
              -f argo-workflows-values.yaml \
              --version 0.20.8

      - name: Install recruIT
        working-directory: tests/chaos
        run: |
          helm upgrade --install -n recruit -f recruit-values.yaml --wait recruit ../../charts/recruit

      - name: Run chaos testing workflow
        working-directory: tests/chaos
        run: |
          ./argo submit argo-workflow.yaml -n recruit --wait --log
