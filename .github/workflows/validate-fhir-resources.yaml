name: validate-fhir-resources

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# a new push to the same PR or branch supersedes the run of the previous commit
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate-fhir-resource:
    name: Validate FHIR resources
    runs-on: ubuntu-26.04
    container: ghcr.io/miracum/ig-build-tools:v2.4.3@sha256:45399d5fcbaf62a9c4ed7f85b5b449c947ce2ab06bfb9b87ea482fd582d6d605
    steps:
      - name: Add workspace as safe directory
        run: |
          git config --global --add safe.directory /__w/recruit/recruit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache FHIR packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /root/.fhir/packages
          key: fhir-packages-${{ hashFiles('fhir/package.json') }}

      - name: Restore FHIR package dependencies
        working-directory: fhir/
        run: |
          fhir restore

      - name: Validate generated FHIR resources
        working-directory: fhir/
        run: |
          find ../src/ -name "*.fhir.json" -exec fhir validate --verbose --fail "{}" \;

      - name: Check sample study Library SQL is consistent
        run: |
          # Library.content.data is base64-encoded, so the FSH source additionally carries each
          # criterion's SQL as plain text in the sql-text extension - both must stay identical.
          jq -e '[.. | objects | select(.resourceType? == "Library") | .content[]? | select(.extension) |
            (.data | @base64d) == (.extension[] | select(.url == "https://sql-on-fhir.org/ig/StructureDefinition/sql-text") | .valueString)] | all' \
            fhir/ig/fsh-generated/resources/Bundle-recruit-sample-study-transaction.json

      - name: Check fsh-generated resources are up-to-date with the FSH source
        continue-on-error: true
        run: |
          # clean rebuild: a stale committed file left over from a since-renamed FSH
          # instance wouldn't otherwise show up as a diff, since sushi doesn't delete output
          # for resources it no longer generates.
          rm -rf fhir/ig/fsh-generated
          sushi --snapshot fhir/ig
          if git diff --exit-code -- fhir/ig/fsh-generated; then
            echo -e "\033[0;32mfsh-generated resources are up to date\033[0m ✔"
          else
            echo -e "\033[0;31mfsh-generated resources are outdated! Please run \`npx fsh-sushi --snapshot fhir/ig\` locally and push the changes.\033[0m ❌"
            exit 1
          fi
