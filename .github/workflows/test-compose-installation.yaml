name: test-compose
on:
  workflow_call:
    inputs:
      image-tag:
        description: "Name of the image tag to test with"
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test Compose installation
    runs-on: ubuntu-26.04
    env:
      RECRUIT_IMAGE_BASE_NAME: ghcr.io/${{ github.repository }}
      RECRUIT_IMAGE_TAG: ${{ inputs.image-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # re-computes the artifact names the build jobs uploaded the images under, same as ci.yaml's `test` job.
      - uses: rlespinasse/slugify-value@f13019fcc1d95a391d12b618028b003adf29ebca # v1.4.1
        id: slugify-list
        with:
          key: LIST_IMAGE
          value: "${{ env.RECRUIT_IMAGE_BASE_NAME }}/list:${{ env.RECRUIT_IMAGE_TAG }}"
          publish-env: false
          slug-maxlength: nolimit

      - uses: rlespinasse/slugify-value@f13019fcc1d95a391d12b618028b003adf29ebca # v1.4.1
        id: slugify-query-sql-on-fhir
        with:
          key: QUERY_SQL_ON_FHIR_IMAGE
          value: "${{ env.RECRUIT_IMAGE_BASE_NAME }}/query-sql-on-fhir:${{ env.RECRUIT_IMAGE_TAG }}"
          publish-env: false
          slug-maxlength: nolimit

      - name: Download list image
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.slugify-list.outputs.slug }}
          path: /tmp/list

      - name: Download query-sql-on-fhir image
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.slugify-query-sql-on-fhir.outputs.slug }}
          path: /tmp/query-sql-on-fhir

      - name: Load container images
        # only load images from artifacts on PRs, otherwise the images
        # are already pushed and tagged in the registry
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          docker load --input /tmp/list/image.tar
          docker load --input /tmp/query-sql-on-fhir/image.tar
          docker image ls -a

      # the quickstart requires Compose 5.6.0 or later, see docs/getting-started/installation.md
      - name: Print Docker Compose version
        run: docker compose version

      # the same command as the Compose quickstart in docs/getting-started/installation.md
      - name: Deploy the demo using Docker Compose
        timeout-minutes: 30
        run: |
          docker compose --project-name=recruit-demo \
            --env-file=compose/.demo.env \
            -f compose/compose.yaml \
            -f compose/compose.demo.yaml up --detach --wait

      - name: List containers
        if: always()
        run: |
          docker compose --project-name=recruit-demo \
            --env-file=compose/.demo.env \
            -f compose/compose.yaml \
            -f compose/compose.demo.yaml ps --all

      - name: Run basic health probes
        run: |
          docker compose --project-name=recruit-demo \
            --env-file=compose/.demo.env \
            -f compose/compose.yaml \
            -f compose/compose.demo.yaml \
            -f compose/compose.probe.yaml run --rm health-probes

      - name: Display logs
        if: always()
        run: |
          docker compose --project-name=recruit-demo \
            --env-file=compose/.demo.env \
            -f compose/compose.yaml \
            -f compose/compose.demo.yaml logs
