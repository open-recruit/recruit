name: build-docs
on:
  pull_request:
    branches:
      - master
    paths:
      - docs/**
      - overrides/**
      - fhir/**
      - charts/**
      - zensical.toml
      - pyproject.toml
      - uv.lock
      - .github/workflows/build-docs.yaml
  # publish the documentation together with each release, so the site never describes unreleased features
  release:
    types:
      - published
  # re-publish from master without cutting a release, e.g. after fixing a typo
  workflow_dispatch: {}

# a new push to the same PR or branch supersedes the run of the previous commit
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Declare default permissions as read only.
permissions:
  contents: read

jobs:
  build-ig:
    name: Build FHIR IG
    runs-on: ubuntu-26.04
    container: ghcr.io/miracum/ig-build-tools:v2.4.3@sha256:45399d5fcbaf62a9c4ed7f85b5b449c947ce2ab06bfb9b87ea482fd582d6d605
    steps:
      - name: Add workspace as safe directory
        run: |
          git config --global --add safe.directory /__w/recruit/recruit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # hashes only the IG's declared dependencies, not the whole sushi-config.yaml: release-please
      # bumps its version every release.
      - name: Hash FHIR IG dependencies
        id: fhir-deps
        run: |
          echo "hash=$(sed -n '/^dependencies:/,/^[^ ]/{/^  /p}' fhir/ig/sushi-config.yaml | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # only pull request runs restore the cache: release and workflow_dispatch runs publish the
      # site, so they only check for an entry and never restore anything another run could have written.
      # zizmor can't evaluate the lookup-only expression, hence the ignore.
      - name: Cache FHIR packages # zizmor: ignore[cache-poisoning]
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # the IG Publisher caches in /root (Java's user.home), but SUSHI follows $HOME, which GitHub
          # sets to /github/home inside containers
          path: |
            /root/.fhir/packages
            /github/home/.fhir/packages
          # the container image pins the publisher and SUSHI versions, which decide the packages they
          # fetch, on top of the IG's own dependencies. fhir/package.json is left out because
          # release-please bumps its version every release.
          key: fhir-packages-${{ hashFiles('.github/workflows/build-docs.yaml') }}-${{ steps.fhir-deps.outputs.hash }}
          restore-keys: fhir-packages-
          lookup-only: ${{ github.event_name != 'pull_request' }}

      - name: Build FHIR IG
        working-directory: fhir/ig
        run: java -jar /usr/local/bin/publisher.jar -ig ig.ini -tx n/a

      - name: Upload FHIR IG output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fhir-ig
          path: fhir/ig/output
          retention-days: 1

  # published with the site, so each release's docs link the scan of the chart it released
  kubescape-reports:
    name: Generate Kubescape Reports
    runs-on: ubuntu-26.04
    container: ghcr.io/chgl/kube-powertools:v2.6.13@sha256:5e6cab6409850248d60d3686f02bf903f5f25aa8aa72058031aa5427d7f1c5cf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Add helm repos and update deps
        run: |
          helm repo add hapifhir https://hapifhir.github.io/hapi-fhir-jpaserver-starter
          helm repo add maildev https://maildev.github.io/helm/
          helm dependency update charts/recruit

      # kubescape can render charts itself, but fails on the recruit.fhirserver.url helper's .Subcharts lookup, so the
      # chart is rendered with helm instead. Using the default values, so the reports show what a plain install deploys.
      # --use-artifacts-from uses the frameworks bundled with the image instead of downloading the latest ones.
      - name: Generate kubescape reports
        run: |
          mkdir kubescape-reports
          helm template recruit charts/recruit > recruit.yaml
          kubescape scan framework nsa --use-artifacts-from "$KS_CACHE_DIR" --keep-local \
            --format=html --output=kubescape-reports/nsa.html recruit.yaml
          kubescape scan framework AllControls --use-artifacts-from "$KS_CACHE_DIR" --keep-local \
            --format=html --output=kubescape-reports/allcontrols.html recruit.yaml

      - name: Upload kubescape reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kubescape-reports
          path: kubescape-reports/
          retention-days: 1

  build-site:
    name: Build Documentation
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # this workflow publishes the site, so it must not restore anything a pull request run
          # could have written
          enable-cache: false

      # --strict fails the build on broken links between pages.
      - name: Build site
        run: uv run --locked zensical build --strict

      - name: Upload site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/
          retention-days: 1

  # the site, the IG, and the kubescape reports build independently, this job puts the IG into the site's fhir/
  # directory and the reports into kubescape-reports/
  assemble:
    name: Assemble Pages
    needs:
      - build-ig
      - build-site
      - kubescape-reports
    runs-on: ubuntu-26.04
    steps:
      - name: Download site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site

      - name: Download FHIR IG output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fhir-ig
          path: site/fhir

      - name: Download kubescape reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kubescape-reports
          path: site/kubescape-reports

      # GitHub Pages can't redirect server-side, so each canonical URL (e.g. fhir/StructureDefinition/<id>), each
      # resource's <type>/<id> and each NamingSystem's identifier system URI (e.g. fhir/identifiers/<id>) gets an
      # index.html that forwards to the resource's page. Those root pages in turn redirect to the language folder.
      - name: Add canonical URL redirects
        env:
          # the canonical from fhir/ig/sushi-config.yaml
          CANONICAL: https://openrecruit.dev/fhir
        run: |
          for resource in site/fhir/en/*.json; do
            jq -r --arg c "$CANONICAL/" '
              select(type == "object" and has("resourceType") and has("id"))
              | "\(.resourceType)-\(.id).html" as $page
              | [
                  "\(.resourceType)/\(.id)",
                  (.url // empty | select(startswith($c)) | ltrimstr($c)),
                  (.uniqueId[]? | select(.type == "uri") | .value | select(startswith($c)) | ltrimstr($c))
                ]
              | unique[]
              | "\(.)\t\($page)"
            ' "$resource"
          done | while IFS=$'\t' read -r path page; do
            dir="site/fhir/$path"
            # never overwrite anything the IG Publisher generated
            [[ -e "$dir" ]] && continue
            target="$(sed -E 's#[^/]+#..#g' <<<"$path")/$page"
            mkdir -p "$dir"
            printf '<!doctype html><meta charset="utf-8"><title>Redirecting</title><link rel="canonical" href="%s"><meta http-equiv="refresh" content="0; url=%s"><a href="%s">%s</a>\n' \
              "$target" "$target" "$target" "$page" >"$dir/index.html"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/
          retention-days: 7

  deploy:
    name: Deploy Documentation
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') }}
    needs:
      - assemble
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
