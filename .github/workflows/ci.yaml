name: ci
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  release:
    types:
      # If you want a workflow to run when stable and pre-releases publish, subscribe to published instead of released and prereleased.
      # <https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#release>
      - published
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

# only the latest commit of a PR or branch is worth testing, so a new push cancels the run it
# supersedes. Release and merge_group runs each have their own ref and never cancel one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-list:
    name: build list
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: miracum/.github/.github/workflows/standard-build.yaml@9b731cc069e92b534c819d2b6f250723b8f2d216 # v1.31.1
    with:
      image: ghcr.io/${{ github.repository }}/list
      build-context: "src/list/"
      enable-buildkit-cache-mount-caching: true

  build-query-sql-on-fhir:
    name: build query-sql-on-fhir
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: miracum/.github/.github/workflows/standard-build.yaml@9b731cc069e92b534c819d2b6f250723b8f2d216 # v1.31.1
    with:
      image: ghcr.io/${{ github.repository }}/query-sql-on-fhir
      build-context: "src/"
      enable-build-test-layer: true
      enable-build-cache: false
      enable-buildkit-cache-mount-caching: true
      build-args: |
        MODULE_NAME=query-sql-on-fhir

  build-superset-library-sync:
    name: build superset-library-sync
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: miracum/.github/.github/workflows/standard-build.yaml@9b731cc069e92b534c819d2b6f250723b8f2d216 # v1.31.1
    with:
      image: ghcr.io/${{ github.repository }}/superset-library-sync
      build-context: "src/"
      enable-build-test-layer: true
      enable-build-cache: false
      enable-buildkit-cache-mount-caching: true
      build-args: |
        MODULE_NAME=superset-library-sync

  chart:
    name: chart
    needs:
      # for their image-version/image-digest outputs
      - build-list
      - build-query-sql-on-fhir
      # only lint, install, and publish the chart once the images it points at have passed all tests
      # (this already depends on the container structure `test` job).
      - compose-test
    uses: miracum/.github/.github/workflows/standard-chart-publish.yaml@9b731cc069e92b534c819d2b6f250723b8f2d216 # v1.31.1
    permissions:
      contents: read
      packages: write # to push the chart and its signature/attestation to ghcr.io
      id-token: write # for keyless chart signing and OIDC-based attestations
      attestations: write # to publish build provenance attestations
      artifact-metadata: write # required by actions/attest-build-provenance
    with:
      chart-path: charts/recruit
      # published as ghcr.io/<owner>/recruit/charts/recruit rather than the default
      # ghcr.io/<owner>/recruit/recruit, matching the location the chart has always been published to.
      registry: ghcr.io/${{ github.repository }}/charts
      # stable per PR (no commit sha), so every push to the same PR overwrites this one OCI tag
      # instead of piling up a new prerelease version per commit. Empty on every other event,
      # which falls back to the workflow's own default: release events use the release tag,
      # everything else uses Chart.yaml's version.
      version: ${{ github.event_name == 'pull_request' && format('0.0.0-pr{0}', github.event.pull_request.number) || '' }}
      # the image tag is the same for all modules, so it doesn't matter which build job we read it from.
      app-version: ${{ github.event_name == 'pull_request' && needs.build-list.outputs.image-version || '' }}
      lint-config: .github/ct/ct.yaml
      install-config: .github/ct/install.yaml
      # this is the only place the chart is deployed to a cluster, so it must also run when only the
      # app images changed, not just the chart - ct install then tests those images via
      # helm-extra-set-args below. Installs every ci/*-values.yaml file and runs `helm test` on each.
      install-all: true
      k8s-versions: '["1.36.1"]'
      extra-helm-repos: |
        hapifhir=https://hapifhir.github.io/hapi-fhir-jpaserver-starter
        maildev=https://maildev.github.io/helm/
      # test ct install against the exact images this run just built instead of the tags baked into
      # values.yaml - those only exist once release-please has cut that release, so on master pushes
      # between releases they point at a tag that was never pushed. Same condition standard-build uses
      # to decide whether to push at all: forked PRs never get their images pushed to ghcr.io, so kind
      # wouldn't be able to pull them - falls back to the chart's default tags there.
      helm-extra-set-args: >-
        ${{
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name)
          && format('--set=list.image.tag={0}@{1},querySqlOnFhir.image.tag={2}@{3}',
            needs.build-list.outputs.image-version, needs.build-list.outputs.image-digest,
            needs.build-query-sql-on-fhir.outputs.image-version, needs.build-query-sql-on-fhir.outputs.image-digest)
          || ''
        }}
      # pins every app image in the published chart to the exact digest its build job produced. On PRs
      # the tag is also replaced with the PR's image tag, so the PR chart deploys the PR's images; on
      # releases the release-please managed tag in values.yaml is kept, i.e. `v1.2.3@sha256:...`.
      # The chart is only published on those two events, so this has no effect on any other.
      images: |
        .list.image.tag=${{ github.event_name == 'pull_request' && needs.build-list.outputs.image-version || '' }}@${{ needs.build-list.outputs.image-digest }}
        .querySqlOnFhir.image.tag=${{ github.event_name == 'pull_request' && needs.build-query-sql-on-fhir.outputs.image-version || '' }}@${{ needs.build-query-sql-on-fhir.outputs.image-digest }}

  test:
    name: test
    runs-on: ubuntu-26.04
    needs:
      - build-query-sql-on-fhir
      - build-superset-library-sync
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: "query-sql-on-fhir"
          - module: "superset-library-sync"
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}/${{ matrix.module }}
      # the image tag is the same for all modules, so it doesn't matter which build job we read it from.
      IMAGE_TAG: ${{ needs.build-query-sql-on-fhir.outputs.image-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # unfortunately we need to re-compute the artifact name as we can't access the matrix job's outputs.
      - uses: rlespinasse/slugify-value@f13019fcc1d95a391d12b618028b003adf29ebca # v1.4.1
        id: slugify-image
        with:
          key: BUILD_IMAGE
          value: "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          publish-env: false
          slug-maxlength: nolimit

      - name: Download image
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.slugify-image.outputs.slug }}
          path: /tmp

      - name: Load image
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          ls -lsa /tmp
          docker load --input /tmp/image.tar
          docker image ls

      - name: Pull image if not in PR
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          docker pull "${IMAGE_NAME}:${IMAGE_TAG}"
          docker image ls -a

      - name: Run container structure tests
        run: |
          curl -LO https://github.com/GoogleContainerTools/container-structure-test/releases/download/v1.22.1/container-structure-test-linux-amd64
          chmod +x container-structure-test-linux-amd64

          ./container-structure-test-linux-amd64 test --image="${IMAGE_NAME}:${IMAGE_TAG}" --config=tests/container-structure/common-tests.yaml

  # list's unit and E2E tests - both start their own Postgres (and, for E2E, HAPI FHIR) via
  # Testcontainers, so they only need Docker, which the runner already has.
  test-list:
    name: test list
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Build
        working-directory: src/list
        run: dotnet build RecruIT.slnx

      # the E2E fixture downloads Chromium itself, but not the system libraries it needs.
      - name: Install Playwright's browser dependencies
        working-directory: src/list
        run: pwsh RecruIT.List.E2ETests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run unit tests
        working-directory: src/list
        run: dotnet test --project RecruIT.List.Tests --no-build

      - name: Run E2E tests
        working-directory: src/list
        run: dotnet test --project RecruIT.List.E2ETests --no-build

  compose-test:
    needs:
      - build-query-sql-on-fhir
      - build-list
      - test
    uses: $/.github/workflows/test-compose-installation.yaml
    with:
      image-tag: ${{ needs.build-query-sql-on-fhir.outputs.image-version }}

  # single stable job to mark as required in the branch ruleset, instead of listing every job (and
  # every matrix/reusable-workflow job name) there. Runs even if a dependency failed or was skipped,
  # since GitHub treats a skipped required check as passing.
  required-checks:
    name: required checks
    if: ${{ always() }}
    needs:
      - chart
      - compose-test
      - test-list
    runs-on: ubuntu-26.04
    steps:
      - name: Fail unless all required jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results of the required jobs: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              exit 1
            fi
          done

  release:
    # the docker compose image tags only change on releases, so
    # it's sufficient to just run tests then.
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      actions: read # for the build provenance attestation step in release.yaml's prepare-artifacts
      attestations: write # release.yaml's prepare-artifacts job attests the release checksums
      contents: write # for release notes
      id-token: write # for creating OIDC tokens for signing
      packages: read # to pull the published Helm chart from ghcr.io
    needs:
      - compose-test
      # listed directly (even though they're already transitively required via
      # compose-test) so their per-module image-digest outputs are addressable here.
      - build-query-sql-on-fhir
      - build-list
      - chart
    uses: $/.github/workflows/release.yaml
    with:
      list-image-digest: ${{ needs.build-list.outputs.image-digest }}
      query-sql-on-fhir-image-digest: ${{ needs.build-query-sql-on-fhir.outputs.image-digest }}
      chart-name: ${{ needs.chart.outputs.chart-name }}
      chart-version: ${{ needs.chart.outputs.chart-version }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  lint:
    uses: miracum/.github/.github/workflows/standard-lint.yaml@9b731cc069e92b534c819d2b6f250723b8f2d216 # v1.31.1
    permissions:
      contents: read
      pull-requests: write # for MegaLinter's PR comment with lint results
      issues: write # for MegaLinter's PR comment/annotations
      security-events: write # for uploading CodeQL's SARIF results to the Security tab
      actions: read # required by the CodeQL analysis steps
    with:
      enable-validate-gradle-wrapper: false
      codeql-languages: '["java", "csharp"]'
      enable-codeql: true
      java-version: "25"
