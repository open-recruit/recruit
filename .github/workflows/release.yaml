name: release

on:
  workflow_call:
    inputs:
      list-image-digest:
        description: "Digest (sha256:...) of the released list image, as produced by its build job"
        required: true
        type: string
      query-sql-on-fhir-image-digest:
        description: "Digest (sha256:...) of the released query-sql-on-fhir image, as produced by its build job"
        required: true
        type: string
      chart-name:
        description: "Name of the Helm chart published by the chart job"
        required: true
        type: string
      chart-version:
        description: "Version of the Helm chart published by the chart job"
        required: true
        type: string
    secrets:
      token:
        description: Token used to create a PR against the miracum/charts repository
        required: true

permissions: {}

jobs:
  prepare-artifacts:
    name: prepare artifacts
    runs-on: ubuntu-26.04
    permissions:
      contents: write # to upload artifacts to the release
      id-token: write # to sign the attestation
      attestations: write # to persist the attestation
      packages: read # to pull the published Helm chart from ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create dist dir
        run: |
          mkdir -p dist/

      # the chart itself is packaged, pushed, and signed by the standard-chart-publish workflow in
      # ci.yaml's chart job. Pull that exact published package instead of re-packaging it here, so the
      # release asset is byte-for-byte the chart that's in the registry.
      - name: Add Helm chart to dist
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          CHART_NAME: ${{ inputs.chart-name }}
          CHART_VERSION: ${{ inputs.chart-version }}
        run: |
          helm pull "oci://ghcr.io/${GITHUB_REPOSITORY}/charts/${CHART_NAME}" --version "${CHART_VERSION}" --destination /tmp
          cp "/tmp/${CHART_NAME}-${CHART_VERSION}.tgz" dist/recruit-helm-chart.tgz

      - name: Pin image tags in compose.yaml to their resolved digests
        # these come directly from each module's own build job output (docker/build-push-action's
        # `digest` output), not from re-querying the registry -- that would leave a window between
        # build and release for the tag to be repointed to a different image.
        env:
          LIST_DIGEST: ${{ inputs.list-image-digest }}
          QUERY_SQL_ON_FHIR_DIGEST: ${{ inputs.query-sql-on-fhir-image-digest }}
        run: |
          # maps each compose service name to its released image's digest
          declare -A digest_for=( [list]="${LIST_DIGEST}" [query-sql-on-fhir]="${QUERY_SQL_ON_FHIR_DIGEST}" )
          for service in "${!digest_for[@]}"; do
            digest="${digest_for[$service]}"
            current="$(yq -r ".services.${service}.image" compose/compose.yaml)"
            updated="$(sed -E "s/(RECRUIT_IMAGE_TAG:-[^}]*)/\1@${digest}/" <<<"${current}")"
            yq -i ".services.${service}.image = \"${updated}\"" compose/compose.yaml
          done

      - name: Build Docker Compose deployment bundle
        run: |
          # -L dereferences symlinks (e.g. compose/fhir/search-parameters-transaction-upsert.json,
          # which points into fhir/ig/fsh-generated/) so the archive contains the actual files.
          cp -rL compose/ dist/
          tar -C dist -zcvf dist/recruit-compose.tgz compose/

      - name: Generate checksums for release assets
        working-directory: dist
        run: |
          sha256sum recruit-compose.tgz recruit-helm-chart.tgz > checksums.sha256

      - name: Generate build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.sha256

      - name: upload assets to release # zizmor: ignore[superfluous-actions] upload release assets directly
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.tgz
            dist/*.sha256
