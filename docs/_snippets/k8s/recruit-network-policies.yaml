---
# deny all traffic to and from the pods in the namespace that isn't explicitly allowed below,
# except for DNS lookups
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-allow-dns
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: list-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: recruit
      app.kubernetes.io/component: list
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # users access the screening list via the ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: http
    # Prometheus scrapes its metrics
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: http-metrics
  egress:
    # reads studies, screening lists, and patients, and saves recruitment status changes
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: recruit
              app.kubernetes.io/name: fhirserver
      ports:
        - port: http
    # its own database
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: recruit
              app.kubernetes.io/name: recruit-postgres
      ports:
        - port: postgresql
    # the SMTP server at 192.0.2.1. The `/32` prefix length limits egress to just this one address
    - to:
        - ipBlock:
            cidr: 192.0.2.1/32
      ports:
        - port: 587
          protocol: TCP
    # the wait-for-migration init container asks the Kubernetes API server whether the migration Job completed.
    # Replace with the address of your API server, see `kubectl get endpoints kubernetes -n default`
    - to:
        - ipBlock:
            cidr: 192.0.2.10/32
      ports:
        - port: 6443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: list-migrate-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: recruit
      app.kubernetes.io/component: list-migrate
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: recruit
              app.kubernetes.io/name: recruit-postgres
      ports:
        - port: postgresql
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: query-sql-on-fhir-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: recruit
      app.kubernetes.io/component: query-sql-on-fhir
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: http-metrics
  egress:
    # reads the studies and writes their screening lists
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: recruit
              app.kubernetes.io/name: fhirserver
      ports:
        - port: http
    # runs the eligibility criteria on the Trino coordinator in the `trino` namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trino
          podSelector:
            matchLabels:
              app.kubernetes.io/name: trino
              app.kubernetes.io/component: coordinator
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: search-parameters-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: recruit
      app.kubernetes.io/component: search-parameters
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: recruit
              app.kubernetes.io/name: fhirserver
      ports:
        - port: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fhir-server-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: recruit
      app.kubernetes.io/name: fhirserver
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # all recruIT modules, as well as the Job installing the SearchParameters
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/instance
                operator: In
                values: [recruit]
              - key: app.kubernetes.io/component
                operator: In
                values: [list, query-sql-on-fhir, search-parameters]
      ports:
        - port: http
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: http-metrics
  egress:
    # its own database
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: recruit
              app.kubernetes.io/name: fhir-server-postgres
      ports:
        - port: postgresql
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fhir-server-postgres-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: recruit
      app.kubernetes.io/name: fhir-server-postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: recruit
              app.kubernetes.io/name: fhirserver
      ports:
        - port: postgresql
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: recruit-postgres-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: recruit
      app.kubernetes.io/name: recruit-postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/instance
                operator: In
                values: [recruit]
              - key: app.kubernetes.io/component
                operator: In
                values: [list, list-migrate]
      ports:
        - port: postgresql
