---
apiVersion: v1
kind: Secret
metadata:
  name: recruit-fhir-server-db-app-user
type: kubernetes.io/basic-auth
stringData:
  username: fhir_server_user
  password: recruit-fhir-server
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: recruit-fhir-server-db
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised
  replicationSlots:
    highAvailability:
      enabled: true
  storage:
    size: 64Gi
  bootstrap:
    initdb:
      database: fhir_server
      owner: fhir_server_user
      secret:
        name: recruit-fhir-server-db-app-user
---
apiVersion: v1
kind: Secret
metadata:
  name: recruit-list-db-app-user
type: kubernetes.io/basic-auth
stringData:
  username: list_user
  password: recruit-list
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: recruit-list-db
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised
  replicationSlots:
    highAvailability:
      enabled: true
  storage:
    size: 8Gi
  bootstrap:
    initdb:
      database: recruit
      owner: list_user
      secret:
        name: recruit-list-db-app-user
