# yaml-language-server: $schema=https://raw.githubusercontent.com/argoproj/argo-workflows/v3.7.2/api/jsonschema/schema.json
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: recruit-query-workflow-
spec:
  entrypoint: full-run
  templates:
    # stands in for whatever updates the data the eligibility criteria are queried against
    - name: etl
      container:
        image: docker.io/docker/whalesay@sha256:178598e51a26abbc958b8a2e48825c90bc22e641de3d31e18aaf55f3258ba93b
        command: [cowsay]
        args: ["Running the ETL job that updates the data lakehouse"]
        securityContext:
          readOnlyRootFilesystem: true
          runAsUser: 65532
          runAsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          runAsNonRoot: true

    - name: recruit-query
      # Argo's own metrics for this step, served by the workflow controller's metrics endpoint. Unlike
      # the ones the query module pushes, they also cover runs that failed before it could push anything.
      metrics:
        prometheus:
          - name: recruit_query_step_duration_seconds
            help: How long the last recruIT query step took
            labels:
              - key: status
                value: "{{status}}"
            gauge:
              realtime: false
              value: "{{duration}}"
          - name: recruit_query_step_runs
            help: recruIT query steps run, by status
            labels:
              - key: status
                value: "{{status}}"
            counter:
              value: "1"
      container:
        image: ghcr.io/open-recruit/recruit/query-sql-on-fhir:v11.0.0 # x-release-please-version
        env:
          # one poll cycle, then exit - non-zero if any study failed, which fails the step
          - name: QUERY_SQL_ON_FHIR_RUN_MODE
            value: one-shot
          - name: FHIR_SERVER_BASE_URL
            value: http://recruit-fhirserver:8080/fhir
          - name: SPRING_DATASOURCE_URL
            value: jdbc:trino://trino:8080/fhir/default
          - name: SPRING_DATASOURCE_USERNAME
            value: trino
          # the pod exits before Prometheus could scrape it, so push the metrics to a Pushgateway instead
          - name: MANAGEMENT_PROMETHEUS_METRICS_EXPORT_PUSHGATEWAY_ENABLED
            value: "true"
          - name: MANAGEMENT_PROMETHEUS_METRICS_EXPORT_PUSHGATEWAY_ADDRESS
            value: prometheus-pushgateway.monitoring.svc:9091
          # labels the pushed metrics with the workflow's namespace rather than the Pushgateway's
          - name: MANAGEMENT_PROMETHEUS_METRICS_EXPORT_PUSHGATEWAY_GROUPINGKEY_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
        securityContext:
          privileged: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - name: tmp-volume
            mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}

    - name: full-run
      dag:
        tasks:
          - name: run-etl
            template: etl
          - name: run-recruit-query
            depends: run-etl
            template: recruit-query
