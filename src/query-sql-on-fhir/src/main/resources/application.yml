query-sql-on-fhir:
  version: "11.0.0" # x-release-please-version
  # "scheduled" (default): run forever, triggering a poll cycle on the cron schedule below.
  # "one-shot": run a single poll cycle, then exit - non-zero if any study failed to process.
  # Intended for running this module as a Job/Argo Workflow step instead of a long-running
  # service; the cron schedule below is ignored in this mode.
  run-mode: scheduled
  # The SQL dialect of the database configured via spring.datasource. A criterion Library is run
  # directly against that database if it has `application/sql;dialect=<sql-dialect>` content, so a
  # Library can carry the same criterion for several dialects side by side. Bundled JDBC drivers:
  # "trino" (io.trino.jdbc.TrinoDriver) and "duckdb" (org.duckdb.DuckDBDriver) - for DuckDB, the
  # tables the criteria query are typically created as views over the FHIR resources via
  # spring.datasource.hikari.connection-init-sql, see docs/trino/index.md.
  sql-dialect: trino
  schedule:
    # every 1 hour
    cron: "@hourly"
  # max number of patients' (ResearchSubject + per-criterion Observation) entries per transaction
  # bundle - a study's full candidate set is submitted as one or more bundles of at most this size,
  # rather than a single unbounded transaction, to stay under the FHIR server's transaction limits.
  transaction-bundle-chunk-size: 500
  # When true, run the eligibility queries and log a per-criterion breakdown of how many patients
  # would be submitted, but do not write anything to the FHIR server. Useful for estimating the
  # scope of a query before committing, especially when the candidate population might be very large.
  dry-run: false
  # When false (default), patients with unknown eligibility for at least one criterion (missing data)
  # are included as candidates for human review. When true, only patients who definitively satisfy
  # every criterion are submitted - unknowns are dropped, eliminating data-gap-driven population
  # inflation at the cost of potentially missing patients with incomplete records.
  require-all-criteria-met: false
  # Abort processing a study if the total number of candidate ResearchSubjects (all-met + unknown)
  # would exceed this value. -1 (default) disables the check. Use dry-run mode first to measure
  # the expected count before setting a threshold.
  max-research-subjects: -1
  funnel:
    # When true, additionally compute and publish each study's eligibility attrition funnel (how
    # many patients remain after cumulatively applying each criterion, in Group.characteristic
    # order) as a Measure/MeasureReport pair every poll cycle. Disabled by default: unlike the main
    # eligibility query, the funnel query cannot benefit from filter-pushdown (it needs a count of
    # excluded patients too), so it is a materially more expensive query against the same data -
    # enable only once that cost has been measured for your database deployment.
    enabled: false
    # A standalone "SELECT COUNT(*) FROM ..." query defining the funnel's anchor "total population"
    # step - deliberately independent of the first criterion's own SQL, which may already apply a
    # narrowing WHERE clause and so cannot be trusted as "everyone who was screened" (see
    # eligibility-criteria-design.md's anchor-criterion-scope warning). E.g.
    # "SELECT COUNT(*) FROM fhir.qs.patient". Required (validated at startup) when funnel.enabled
    # is true; also used to preview the funnel in dry-run mode even when funnel.enabled is false.
    total-population-sql: "SELECT COUNT(*) FROM Patient"

fhir:
  server:
    # base URL of the FHIR server, e.g. "https://fhir.example.com/fhir". Set via FHIR_SERVER_BASE_URL.
    base-url: ""
    # call, connect, read, and write timeout to the FHIR server in seconds
    timeout-in-seconds: 300
  use-update-as-create: false

# base URL of a sql-on-fhir server (e.g. Pathling) implementing the $sqlquery-run operation.
# only required if any of the polled SQLQuery Library resources depend on ViewDefinitions
# (via relatedArtifact) or have no content in the configured query-sql-on-fhir.sql-dialect.
sql-on-fhir:
  url: ""

# Disabled by default: exporting spans to a collector nobody deployed is just overhead for
# nothing, so this is opt-in per environment rather than always-on. This is the OpenTelemetry
# Spring Boot starter's own standard property (bound from the OTEL_SDK_DISABLED env var like any
# other OTEL_* var, e.g. OTEL_EXPORTER_OTLP_ENDPOINT/OTEL_SERVICE_NAME) - no app-specific flag.
#
# metrics/logs exporters are off regardless: this app already has its own metrics (management.*
# below, scraped via Prometheus) and console logging pattern, and a traces-only backend like
# Jaeger doesn't implement the OTLP logs endpoint anyway - without this, enabling the SDK produces
# "Failed to export logs. Server responded with HTTP status code 404." once a log line is emitted.
otel:
  sdk:
    disabled: true
  metrics:
    exporter: none
  logs:
    exporter: none

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:%5p}) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m %X %n${LOG_EXCEPTION_CONVERSION_WORD:%wEx}"

spring:
  datasource:
    driver-class-name: io.trino.jdbc.TrinoDriver
    url: ""
    username: ""
    password: ""
  profiles:
    active: dev
  application:
    name: query-sql-on-fhir

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  prometheus:
    metrics:
      export:
        # For one-shot runs (query-sql-on-fhir.run-mode above): the pod is gone before Prometheus would
        # scrape it, so push to a Pushgateway instead - every push-rate while running, and once more
        # on shutdown, after the poll. A PUT replaces everything the previous run pushed, so e.g. a
        # since-removed study's series don't linger. Enable via MANAGEMENT_PROMETHEUS_METRICS_EXPORT_PUSHGATEWAY_ENABLED
        # and set _ADDRESS (host:port). A _GROUPINGKEY_<NAME> env var adds a label to every pushed
        # metric - e.g. _GROUPINGKEY_NAMESPACE, since the Pushgateway's own namespace would otherwise
        # replace the run's.
        pushgateway:
          enabled: false
          address: "localhost:9091"
          job: "${spring.application.name}"
          shutdown-operation: put
  metrics:
    distribution:
      # histogram buckets for the FHIR client's request timer (see FhirConfig), so its latency
      # percentiles can be computed in Prometheus - off by default for every timer.
      percentiles-histogram:
        "[fhir.client]": true

server:
  shutdown: graceful
