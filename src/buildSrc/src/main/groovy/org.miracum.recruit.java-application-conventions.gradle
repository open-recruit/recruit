/*
 * This file was generated by the Gradle 'init' task.
 *
 * This project uses @Incubating APIs which are subject to change.
 */

plugins {
    id 'org.miracum.recruit.java-common-conventions'

    id 'org.springframework.boot'

    id 'io.spring.dependency-management'

    id 'jacoco'

    id 'com.diffplug.spotless'

    id 'io.freefair.lombok'

    id 'de.undercouch.download'

    id 'checkstyle'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    implementation 'ca.uhn.hapi.fhir:hapi-fhir-client:8.12.1'
    implementation 'ca.uhn.hapi.fhir:hapi-fhir-base:8.12.1'
    implementation 'ca.uhn.hapi.fhir:hapi-fhir-structures-r4:8.12.1'
    implementation 'ca.uhn.hapi.fhir:hapi-fhir-client-okhttp:8.12.1'

    implementation 'com.squareup.okhttp3:okhttp:5.5.0'

    implementation 'net.logstash.logback:logstash-logback-encoder:9.0'

    implementation 'org.postgresql:postgresql:42.7.13'

    // let Spring Boot's dependency-management BOM pick the version compatible with the current
    // Spring Boot release
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.micrometer:micrometer-core'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
}

test {
    useJUnitPlatform()
}

jar {
    enabled = false
}

jacoco {
    toolVersion = '0.8.15'
}

jacocoTestReport {
}

spotless {
    java {
        importOrder()
        removeUnusedImports()
        googleJavaFormat()
        toggleOffOn()
    }
}

checkstyle {
    toolVersion = '14.3.0'
    configFile = file('../config/checkstyle/checkstyle.xml')
}
