plugins {
    id 'groovy-gradle-plugin'
}

repositories {
    // Use the plugin portal to apply community plugins in convention plugins.
    gradlePluginPortal()
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-gradle-plugin:4.1.1'
    implementation 'io.spring.gradle:dependency-management-plugin:1.1.7'
    implementation 'com.diffplug.spotless:spotless-plugin-gradle:8.10.4'
    implementation 'io.freefair.gradle:lombok-plugin:9.8.0'
    implementation 'de.undercouch:gradle-download-task:5.7.0'
}
