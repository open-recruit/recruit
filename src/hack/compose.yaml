services:
  fhir:
    image: docker.io/hapiproject/hapi:v8.12.0-2@sha256:0ff86aac4c7bd13a1ee226444a70263bb46ed1c28ef543c30a44f865b80ca04e
    restart: unless-stopped
    cap_drop:
      - ALL
    ipc: none
    security_opt:
      - "no-new-privileges:true"
    deploy:
      resources:
        limits:
          memory: 2048m
    read_only: true
    tmpfs:
      - /tmp
      - /app/target
    privileged: false
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://db:5432/fhir?currentSchema=public"
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      spring.jpa.properties.hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgres94Dialect
      HAPI_FHIR_VALIDATION_REQUESTS_ENABLED: "false"
      HAPI_FHIR_USE_APACHE_ADDRESS_STRATEGY: "true"
      HAPI_FHIR_ENFORCE_REFERENTIAL_INTEGRITY_ON_DELETE: "false"
      HAPI_FHIR_ENFORCE_REFERENTIAL_INTEGRITY_ON_WRITE: "false"
      HAPI_FHIR_SUBSCRIPTION_RESTHOOK_ENABLED: "true"
      HAPI_FHIR_ALLOW_MULTIPLE_DELETE: "true"
      # don't reuse an identical search's results for a minute, so new screening lists and their entries
      # show up straight away, e.g. after re-recommending a patient on the Notification Test page
      HAPI_FHIR_REUSE_CACHED_SEARCH_RESULTS_MILLIS: "0"
      JAVA_TOOL_OPTIONS: "-javaagent:/app/opentelemetry-javaagent.jar"
      OTEL_METRICS_EXPORTER: "none"
      OTEL_LOGS_EXPORTER: "none"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_SERVICE_NAME: "hapi-fhir-jpaserver"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
    depends_on:
      db:
        condition: service_started
    ports:
      - "127.0.0.1:8082:8080"

  db:
    image: docker.io/library/postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024m
    ipc: private
    security_opt:
      - "no-new-privileges:true"
    privileged: false
    environment:
      POSTGRES_PASSWORD: postgres # pragma: allowlist secret
    volumes:
      - ./postgres-initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"

  query-sql-on-fhir:
    build:
      context: ..
      args:
        MODULE_NAME: query-sql-on-fhir
    profiles:
      - query-sql-on-fhir
    restart: unless-stopped
    ipc: none
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    privileged: false
    environment:
      FHIR_SERVER_BASE_URL: "http://fhir:8080/fhir"
      SPRING_DATASOURCE_URL: "jdbc:trino://trino:8080/fhir/default"
      SPRING_DATASOURCE_USERNAME: "trino"
      SPRING_DATASOURCE_PASSWORD: ""
      # Set this if you stand up a sql-on-fhir server (e.g. Pathling) separately.
      SQL_ON_FHIR_URL: ""
      OTEL_SDK_DISABLED: "false"
      OTEL_METRICS_EXPORTER: "none"
      OTEL_LOGS_EXPORTER: "none"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_SERVICE_NAME: "query-sql-on-fhir"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 1024
    depends_on:
      # ensures the Delta tables are converted, uploaded, and registered in the Hive metastore -
      # i.e. actually queryable via Trino - before this module starts polling for studies.
      warehousekeeper:
        condition: service_completed_successfully

  jaeger:
    image: docker.io/jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    environment:
      COLLECTOR_OTLP_ENABLED: true
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:6831:6831/udp"
      - "127.0.0.1:6832:6832/udp"
      - "127.0.0.1:14250:14250/tcp"
      - "127.0.0.1:4318:4318"

  maildev:
    image: docker.io/maildev/maildev:3.0.0@sha256:6e09695961f4aef9016a390ad391314a078220216601b15a35d389a7df2a3855
    restart: unless-stopped
    ipc: none
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    privileged: false
    deploy:
      resources:
        limits:
          memory: 64m
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:3025:1025"
      - "127.0.0.1:2080:1080"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    restart: unless-stopped
    ipc: none
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    privileged: false
    deploy:
      resources:
        limits:
          memory: 2048m
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_METRICS_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - type: bind
        source: ./keycloak/recruit-realm-export.json
        target: /opt/keycloak/data/import/recruit-realm-export.json
        read_only: true
    ports:
      - "127.0.0.1:8083:8080"

  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    restart: unless-stopped
    # the image's own seaweed user. Setting it here skips the entrypoint's chown + su-exec dance,
    # which would otherwise need CAP_CHOWN/CAP_SETUID/CAP_SETGID.
    user: "1000:1000"
    ipc: none
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    privileged: false
    # all-in-one master, volume, filer, and S3 gateway. Creates the bucket on startup if it doesn't
    # already exist, so there's no need for a separate bucket-creation job.
    command:
      - mini
      - -bucket=fhir
    environment:
      # used as the S3 gateway's admin identity
      AWS_ACCESS_KEY_ID: "admin"
      # kics-scan ignore-line
      AWS_SECRET_ACCESS_KEY: "seaweedfspass" # gitleaks:allow
    healthcheck:
      # the bucket is only created a few seconds after the S3 gateway is up, so probe the bucket
      # itself instead of /healthz - this way, dependents can rely on it existing.
      test:
        - CMD-SHELL
        - curl -sSf -o /dev/null -I --aws-sigv4 aws:amz:eu-central-1:s3 --user "$$AWS_ACCESS_KEY_ID:$$AWS_SECRET_ACCESS_KEY" http://127.0.0.1:8333/fhir
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      # S3 API
      - "127.0.0.1:8333:8333"
      # admin UI
      - "127.0.0.1:23646:23646"
    deploy:
      resources:
        limits:
          memory: 1G

  upload-to-fhir-server:
    # the image is overkill, but it is the only one that has the necessary tools and is up-to-date
    image: ghcr.io/chgl/kube-powertools:v2.6.13@sha256:5e6cab6409850248d60d3686f02bf903f5f25aa8aa72058031aa5427d7f1c5cf
    ipc: none
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    privileged: false
    restart: "no"
    environment:
      FHIR_SERVER_BASE_URL: http://fhir:8080/fhir
    entrypoint: ["/bin/bash", "-c"]
    working_dir: /synthea/
    command:
      - |
        set -euo pipefail
        until [ "$(curl -s -o /dev/null -L -w "%{http_code}" "$$FHIR_SERVER_BASE_URL/metadata")" == "200" ]; do
            echo "$(date): Waiting for FHIR server @ $$FHIR_SERVER_BASE_URL to be up";
            sleep 5;
        done;
        echo "Server is up. Sending resources.";
        ls -lsa /synthea/
        /synthea/post-transactions.sh
        echo "Loading SearchParameter resources.";
        curl --fail-with-body --retry-connrefused -X POST -H "Content-Type: application/fhir+json" --data @/fhir/search-parameters-transaction-upsert.json "$$FHIR_SERVER_BASE_URL"
        curl --fail-with-body --retry-connrefused -X POST -H "Content-Type: application/fhir+json" --data @/fhir/sample-study-transaction-upsert.json "$$FHIR_SERVER_BASE_URL"
    volumes:
      - ./synthea/:/synthea/
      # ./fhir/*-transaction-upsert.json are symlinks pointing outside of ./fhir/.
      # Mounting ./fhir/ as a whole would carry that symlink into the container, and Docker
      # resolves mount targets through existing symlinks - so a later mount at the same path
      # would follow it and (since /fhir/ is a live bind mount) recreate the resolved directory
      # tree back on the host. Mount each file individually by its real path instead.
      - ../../fhir/ig/fsh-generated/resources/Bundle-recruit-search-parameters-transaction.json:/fhir/search-parameters-transaction-upsert.json:ro
      - ../../fhir/ig/fsh-generated/resources/Bundle-recruit-sample-study-transaction.json:/fhir/sample-study-transaction-upsert.json:ro
    depends_on:
      fhir:
        condition: service_started

  convert-to-delta:
    # the fhir-to-lakehouse image already ships Pathling, Delta Lake, and hadoop-aws along with all
    # their jars, so nothing needs to be downloaded at runtime.
    image: ghcr.io/bzkf/fhir-to-lakehouse:v1.15.0@sha256:c3f19ce27a4a895042857b8d545e081a51b775aff1e9aa37eae4a720ba51456a
    ipc: none
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    privileged: false
    restart: "no"
    environment:
      AWS_ENDPOINT_URL: "http://seaweedfs:8333"
      AWS_ACCESS_KEY_ID: "admin"
      AWS_SECRET_ACCESS_KEY: "seaweedfspass" # gitleaks:allow
    entrypoint: ["python3", "-c"]
    command:
      - |
        import glob
        import os

        from pathling import PathlingContext
        from pyspark.sql import SparkSession

        jars = sorted(glob.glob(os.path.join(os.environ["SPARK_JARS_DIR"], "*.jar")))
        spark = (
            SparkSession.builder.config("spark.jars", ",".join(jars))
            .config("spark.sql.extensions", "io.delta.sql.DeltaSparkSessionExtension")
            .config("spark.sql.catalog.spark_catalog", "org.apache.spark.sql.delta.catalog.DeltaCatalog")
            .config("spark.hadoop.fs.s3a.endpoint", os.environ["AWS_ENDPOINT_URL"])
            .config("spark.hadoop.fs.s3a.access.key", os.environ["AWS_ACCESS_KEY_ID"])
            .config("spark.hadoop.fs.s3a.secret.key", os.environ["AWS_SECRET_ACCESS_KEY"])
            .config("spark.hadoop.fs.s3a.path.style.access", "true")
            .config("spark.hadoop.fs.s3a.connection.ssl.enabled", "false")
            .getOrCreate()
        )

        data_source = PathlingContext.create(spark).read.ndjson("/tmp/import")
        data_source.write.delta("s3a://fhir/default", save_mode="overwrite")
    volumes:
      - ./synthea/bulk/fhir/:/tmp/import/:ro
    depends_on:
      seaweedfs:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G

  warehousekeeper:
    image: ghcr.io/bzkf/fhir-to-lakehouse:v1.15.0@sha256:c3f19ce27a4a895042857b8d545e081a51b775aff1e9aa37eae4a720ba51456a
    ipc: none
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    privileged: false
    restart: "no"
    environment:
      AWS_ALLOW_HTTP: "1"
      AWS_REGION: "eu-central-1"
      AWS_ENDPOINT_URL: "http://seaweedfs:8333"
      AWS_ACCESS_KEY_ID: "admin"
      AWS_SECRET_ACCESS_KEY: "seaweedfspass" # gitleaks:allow
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        python3 /app/src/lakehousekeeper.py register --bucket-name=fhir --database-name-prefix=default/ --hive-metastore=thrift://hive-metastore:9083
        python3 /app/src/lakehousekeeper.py vacuum   --bucket-name=fhir --database-name-prefix=default/ --retention-hours=0 --dry-run=false --enforce-retention-duration=false
    volumes:
      - ./config/spark-defaults.conf:/app/spark/conf/spark-defaults.conf:ro
    depends_on:
      convert-to-delta:
        condition: service_completed_successfully
      hive-metastore:
        condition: service_started
      trino:
        condition: service_started

  hive-metastore:
    image: ghcr.io/miracum/util-images/hive-metastore:v1.4.3@sha256:91f6a16a2d80911f5cf1e411bb36590df763269f3ff1efbff4f811eb63d56483
    ipc: none
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    privileged: false
    restart: unless-stopped
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: |
        -Djavax.jdo.option.ConnectionUserName=postgres
        -Djavax.jdo.option.ConnectionPassword=postgres
      AWS_ACCESS_KEY_ID: "admin"
      AWS_SECRET_ACCESS_KEY: "seaweedfspass" # gitleaks:allow
      AWS_DEFAULT_REGION: "eu-central-1"
    volumes:
      - ./config/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
    depends_on:
      db:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1G

  trino:
    image: docker.io/trinodb/trino:483@sha256:db58cc93e593a2706553745f276bb119c9810e69918be56ecde088ba7ccb0534
    ipc: none
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    privileged: false
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: "admin"
      AWS_SECRET_ACCESS_KEY: "seaweedfspass" # gitleaks:allow
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config/trino/etc:/etc/trino:ro
    depends_on:
      hive-metastore:
        condition: service_started
