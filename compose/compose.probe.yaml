services:
  health-probes:
    image: docker.io/curlimages/curl:8.23.0@sha256:11e64e28c5f58c8d93ee95fcf22ac055f48b0bc440e0ce7d8013bbb5ad6aa8ac
    ipc: private
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    mem_limit: 32m
    privileged: false
    read_only: true
    user: 65532:65532
    command: >
      sh -euxc "curl --fail --retry-connrefused --connect-timeout 30 --max-time 60 --retry 10 --retry-delay 30 http://fhir:8080/fhir/metadata?_summary=true &&
                curl --fail --retry-connrefused --connect-timeout 30 --max-time 60 --retry 10 --retry-delay 30 http://query-sql-on-fhir:8080/actuator/health &&
                curl --fail --retry-connrefused --connect-timeout 30 --max-time 60 --retry 10 --retry-delay 30 http://list:8080/readyz &&
                curl --fail --retry-connrefused --connect-timeout 30 --max-time 60 --retry 10 --retry-delay 30 http://maildev:1080/api/healthz"
