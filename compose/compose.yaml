services:
  list:
    image: ${RECRUIT_IMAGE_BASE_NAME:-ghcr.io/open-recruit/recruit}/list:${RECRUIT_IMAGE_TAG:-v10.5.7} # x-release-please-version
    restart: unless-stopped
    ipc: none
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    privileged: false
    environment:
      FhirServer__BaseUrl: ${FHIR_SERVER_BASE_URL:?}
      Auth__Enabled: ${AUTH_ENABLED:-false}
      Auth__Oidc__Authority: ${AUTH_OIDC_AUTHORITY:-}
      Auth__Oidc__ClientId: ${AUTH_OIDC_CLIENT_ID:-}
      Auth__Oidc__ClientSecret: ${AUTH_OIDC_CLIENT_SECRET:-}
      Auth__Oidc__RoleClaimType: ${AUTH_OIDC_ROLE_CLAIM_TYPE:-role}
      ConnectionStrings__AppDb: ${LIST_CONNECTIONSTRINGS_APPDB:?}
      PGPASSWORD: ${PGPASSWORD:?}

  query-sql-on-fhir:
    image: ${RECRUIT_IMAGE_BASE_NAME:-ghcr.io/open-recruit/recruit}/query-sql-on-fhir:${RECRUIT_IMAGE_TAG:-v10.5.7} # x-release-please-version
    restart: unless-stopped
    ipc: none
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    privileged: false
    environment:
      FHIR_SERVER_BASE_URL: ${FHIR_SERVER_BASE_URL:?}
      SPRING_DATASOURCE_URL: ${TRINO_JDBC_URL:?}
      SPRING_DATASOURCE_USERNAME: ${TRINO_USERNAME:?}
      # may be empty: Trino only accepts a password over TLS, so one without authentication needs none
      SPRING_DATASOURCE_PASSWORD: ${TRINO_PASSWORD?}
      QUERY_SQL_ON_FHIR_SCHEDULE_CRON: ${QUERY_SQL_ON_FHIR_SCHEDULE_CRON:-@hourly}
      SQL_ON_FHIR_URL: ${SQL_ON_FHIR_URL:-}
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 1024

  create-search-parameters:
    image: docker.io/curlimages/curl:8.23.0@sha256:11e64e28c5f58c8d93ee95fcf22ac055f48b0bc440e0ce7d8013bbb5ad6aa8ac
    restart: "no"
    ipc: none
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    privileged: false
    environment:
      FHIR_SERVER_BASE_URL: ${FHIR_SERVER_BASE_URL:?}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        until [ "$(curl -s -o /dev/null -L -w '%{http_code}' "$$FHIR_SERVER_BASE_URL/metadata")" = "200" ]; do
          echo "$(date): Waiting for FHIR server @ $$FHIR_SERVER_BASE_URL to be up";
          sleep 5;
        done;
        echo "Installing SearchParameter resources on $$FHIR_SERVER_BASE_URL..."
        curl -sS --fail-with-body --retry 5 --retry-delay 5 --retry-connrefused --retry-all-errors \
          -X POST \
          -H "Content-Type: application/fhir+json" \
          --data @/fhir/search-parameters-transaction-upsert.json \
          "$$FHIR_SERVER_BASE_URL"
    volumes:
      - ./fhir/search-parameters-transaction-upsert.json:/fhir/search-parameters-transaction-upsert.json:ro
