# Default values for recruit.

# -- image pull secrets used by all pods
imagePullSecrets: []

# -- partially override the release name
nameOverride: ""

# -- fully override the release name
fullnameOverride: ""

# -- annotations to set on all Deployment resources
deploymentAnnotations: {}
  # sidecar.jaegertracing.io/inject: "jaeger-prod"

# -- annotations to set on all Pod resources
podAnnotations: {}
  # linkerd.io/inject: "enabled"

# -- additionally labels to apply to all deployments
extraLabels: {}

# configure the init container used by the list module's migration Job to wait for
# the included PostgreSQL database
waitForPostgresInitContainer:
  # image to use for the init container which waits until the database
  # is ready to accept connections
  # @ignore
  image: # +doc-gen:ignore
    registry: docker.io
    repository: library/postgres
    tag: 18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
    pullPolicy: IfNotPresent

# container security context applied to init containers used by the list and query modules.
# also used by the Helm test job pods
# @ignore
restrictedContainerSecurityContext: # +doc-gen:ignore
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

fhirserver:
  # -- Whether the included HAPI FHIR server should be used
  # See <https://github.com/hapifhir/hapi-fhir-jpaserver-starter/tree/master/charts/hapi-fhir-jpaserver#values> for options.
  enabled: true
  postgres:
    # -- overrides the chart's postgres server name to avoid conflicts with the included postgres chart
    nameOverride: "fhir-server-postgres"
  # -- extra environment variables set for the HAPI FHIR server
  extraEnv:
    # the recruit tool relies on the FHIR server subscription mechanism to create notifications.
    # if you overwrite `fhirserver.extraEnv`, make sure to keep this setting enabled.
    - name: HAPI_FHIR_SUBSCRIPTION_RESTHOOK_ENABLED
      value: "true"
    - name: SPRING_FLYWAY_BASELINE_ON_MIGRATE
      value: "true"

# installs the custom SearchParameter resources required by recruIT (e.g. by the list and query-sql-on-fhir modules)
# via a Helm `post-install` and `pre-upgrade` hook Job, using `curl`.
createSearchParameters:
  # -- whether to install/update the SearchParameter resources on `helm install` and every `helm upgrade`. Only takes
  # effect if `fhirserver.enabled=true` or `externalFhirServer.url` is set.
  enabled: true
  # -- number of retries for the Job before it is considered failed
  backoffLimit: 3
  # -- automatically delete the Job this many seconds after it finished. Set to `null` to disable.
  ttlSecondsAfterFinished: 600
  # -- annotations to add to the Job's pod
  podAnnotations: {}
  # -- set container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge). This is ignored if `resources` is set.
  # More information: <https://github.com/miracum/charts/blob/master/charts/common/templates/_resources.tpl#L1>
  resourcesPreset: "nano"
  # -- configure the job pod's resource requests and limits
  resources: {}

# installs a sample ResearchStudy whose SQL-based eligibility criteria are evaluated by the query-sql-on-fhir module,
# via a Helm `post-install` and `post-upgrade` hook Job, using `curl`. Intended for demos, together with the
# `syntheticPatients`, see `values-demo.yaml`.
sampleStudy:
  # -- whether to install/update the sample ResearchStudy. Only takes effect if `fhirserver.enabled=true` or
  # `externalFhirServer.url` is set.
  enabled: false
  # -- number of retries for the Job before it is considered failed
  backoffLimit: 3
  # -- automatically delete the Job this many seconds after it finished. Set to `null` to disable.
  ttlSecondsAfterFinished: 600
  # -- annotations to add to the Job's pod
  podAnnotations: {}
  # -- set container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge). This is ignored if `resources` is set.
  # More information: <https://github.com/miracum/charts/blob/master/charts/common/templates/_resources.tpl#L1>
  resourcesPreset: "nano"
  # -- configure the job pod's resource requests and limits
  resources: {}

# generates synthetic patients using [Synthea](https://github.com/synthetichealth/synthea), intended for demos, see
# `values-demo.yaml`: a Helm `post-install` and `post-upgrade` hook Job loads them into the FHIR server, and if
# `querySqlOnFhir.sqlDialect=duckdb`, an init container of the query module's pod generates the exact same patients
# as NDJSON files into `/data/fhir/`, to be queried via DuckDB (see `querySqlOnFhir.duckdb.initSql`). The same seed,
# reference date, and Synthea version always generate the same patients with the same resource ids.
syntheticPatients:
  # -- whether to generate synthetic patients. Only takes effect if `fhirserver.enabled=true` or
  # `externalFhirServer.url` is set.
  enabled: false
  # -- seed for Synthea's random number generators
  seed: "20250916"
  # -- date (YYYYMMDD) the patients' records are generated up to. Fixed, so their ages and resources don't change
  # depending on when they're generated.
  referenceDate: "20250916"
  # -- number of living synthetic patients to generate
  population: 100
  # -- number of retries for the Job before it is considered failed
  backoffLimit: 3
  # -- annotations to add to the Job's pod
  podAnnotations: {}
  # -- resource requests and limits for the containers running Synthea. Synthea generates the patients in parallel,
  # one thread per core. 100 patients need well under 1Gi of memory.
  resources:
    limits:
      cpu: 4000m
      ephemeral-storage: 2Gi
      memory: 1536Mi
    requests:
      cpu: 500m
      ephemeral-storage: 2Gi
      memory: 1536Mi
  # the image containing Synthea, as well as curl and jq to load the patients into the FHIR server
  # @ignore
  image: # +doc-gen:ignore
    registry: ghcr.io
    repository: miracum/ig-build-tools
    tag: v2.4.3@sha256:45399d5fcbaf62a9c4ed7f85b5b449c947ce2ab06bfb9b87ea482fd582d6d605

externalFhirServer:
  # -- URL of an external FHIR Server - only used when `fhirserver.enabled` is set to `false`
  url: ""

maildev:
  # -- Whether the included SMTP test server should be used. Not required for a production deployment.
  # See <https://github.com/maildev/helm/blob/main/charts/maildev/values.yaml> for available options.
  enabled: true
  # @ignore
  serviceAccount: # +doc-gen:ignore
    create: false
  # @ignore
  securityContext: # +doc-gen:ignore
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    # the `node` user of the maildev image
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
list:
  # -- Whether the list module should be enabled. Requires a PostgreSQL database, see `list.database`.
  enabled: true
  # -- Number of replicas for the list module. A fault-tolerant number of replicas is recommended.
  replicaCount: 1
  # -- specify how many old ReplicaSets for this Deployment you want to retain.
  revisionHistoryLimit: 5

  # -- seconds the kubelet waits after starting pod termination (preStop hook + SIGTERM) before
  # force-killing the container. Must comfortably exceed `lifecycle.preStop.sleep.seconds` below,
  # plus however long the app itself takes to finish in-flight requests after SIGTERM.
  terminationGracePeriodSeconds: 30

  # Delays SIGTERM by a few seconds after a pod is marked for termination (e.g. during
  # `kubectl rollout restart` or a `helm upgrade`). This closes a race between the pod being
  # removed from Service endpoints/ingress upstreams - which happens asynchronously - and the app
  # actually stopping: without it, clients can see 502s because traffic keeps arriving for a
  # moment after the app has already stopped listening. Uses Kubernetes' native `sleep` lifecycle
  # action rather than an `exec` hook, since list's base image is chiseled and has no shell to
  # run `sleep` in.
  # @ignore
  lifecycle: # +doc-gen:ignore
    enabled: true
    preStop:
      sleep:
        seconds: 10

  # the list module's image
  # @ignore
  image: # +doc-gen:ignore
    registry: ghcr.io
    repository: open-recruit/recruit/list
    tag: v10.5.7 # x-release-please-version
    pullPolicy: IfNotPresent

  serviceAccount:
    # -- Specifies whether a service account should be created.
    create: false
    # -- Annotations to add to the service account
    annotations: {}
    # -- The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""
    # -- whether to automount the SA token.
    automountServiceAccountToken: false

  # -- settings for the Job that runs list's DB migrations once per image tag, ahead of the
  # Deployment's pods (see the wait-for-migration initContainer below).
  migrationJob:
    # -- number of retries for the migration Job before it is considered failed
    backoffLimit: 3
    # -- delete the migration Job this many seconds after it finishes; set to `null` to disable.
    # Acts as a safety net if the GitOps controller doesn't prune superseded Jobs - a new image tag
    # always produces a differently-named Job, so old ones would otherwise accumulate.
    ttlSecondsAfterFinished: 600
    # -- annotations to add to the migration Job's pod
    podAnnotations: {}
    # -- set the migration Job container's resources according to one common preset (allowed
    # values: none, nano, micro, small, medium, large, xlarge, 2xlarge). Ignored if `resources` is set.
    resourcesPreset: "small"
    # -- resource requests and limits for the migration Job container
    resources: {}
    # -- number of attempts (waitPollIntervalSeconds apart) the wait-for-migration initContainer
    # polls the migration Job before giving up and failing the pod. The default (60 * 10s = 10 min)
    # mirrors the grace period the old startupProbe gave in-process migrations.
    waitMaxAttempts: 60
    # -- seconds between wait-for-migration polls of the migration Job's status
    waitPollIntervalSeconds: 10

  podDisruptionBudget:
    # -- create a PodDisruptionBudget resource
    enabled: false
    # -- Minimum available instances; ignored if there is no PodDisruptionBudget
    minAvailable: 1
    # -- Maximum unavailable instances; ignored if there is no PodDisruptionBudget
    maxUnavailable: ""

  # -- the service used to expose the list module
  service:
    # -- service type
    type: ClusterIP
    # -- service port for the HTTP endpoint
    port: 8080
    # -- service port for the Prometheus metrics endpoint
    metricsPort: 8081

  database:
    # -- Npgsql connection string for list's own data (trial access grants, notification poll
    # cursors, and the Hangfire job store backing its notification poller), e.g.
    # `Host=postgres;Port=5432;Database=list`. Omit credentials here and set them via
    # `username`/`password` below instead - they are injected as `PGUSER`/`PGPASSWORD` env vars,
    # which Npgsql falls back to for any credentials missing from the connection string.
    # If empty and `postgres.enabled=true`, the included PostgreSQL database is used instead and
    # the `username`, `password`, and `existingSecret` settings below are ignored.
    connectionString: ""
    # -- the username to connect to the database as. Injected as the `PGUSER` env var, in both the
    # Deployment and the migration Job. Leave empty to omit `PGUSER`/`PGPASSWORD` entirely.
    username: ""
    # -- the password used to connect to the database. Injected as the `PGPASSWORD` env var.
    # Ignored if `existingSecret.name` is set.
    password: ""
    existingSecret:
      # -- name of an existing Kubernetes secret that contains the database password
      name: ""
      # -- the key inside the existing secret containing the password
      key: "db-password"

  auth:
    # -- if enabled, requires OIDC authentication before accessing list. If disabled, every
    # visitor is treated as an authenticated admin - only safe for local development/testing.
    enabled: false
    oidc:
      # -- the OIDC authority/issuer URL
      authority: ""
      # -- the OIDC client id
      clientId: ""
      # -- the OIDC client secret. Ignored if `existingSecret.name` is set
      clientSecret: ""
      existingSecret:
        # -- name of an existing Kubernetes Secret containing the OIDC client secret
        name: ""
        # -- key inside the existing secret
        key: "oidc-client-secret"
      # -- the claim type used to map roles from the ID token, e.g. `role` or `realm_access.roles`
      roleClaimType: "role"

  notifications:
    # -- a pending recommendation is highlighted as stalled if untouched for this many days
    stalledLeadWindowDays: 14
    # -- how often, in seconds, list scans for screening list changes to notify about
    scanIntervalSeconds: 60
    testing:
      # -- adds a button to the admin-only Notification Test page that removes a patient from a trial's
      # screening list and adds them back, notifying every subscriber of that trial for real, in the app
      # and by email. Meant for development, demo and test deployments only.
      enabled: false
    email:
      # -- the URL users reach list at, used to build the links in notification emails. If
      # `list.ingress.enabled` is `true`, the first ingress host is used instead.
      publicBaseUrl: "http://localhost:8080/"
      # -- the sender email address for notification mails
      from: "recruit@example.com"
      # -- subject line template, a composite format string (see .NET's String.Format) with a single
      # `{0}` placeholder for the study acronym
      subjectTemplate: "MIRACUM Rekrutierungsunterstützung: neue Vorschläge für die Studie {0}"
      smtp:
        # -- hostname of the external SMTP mail server. Only used if `maildev.enabled` is `false`
        host: ""
        # -- mailserver port
        port: 25
        # -- mailserver username
        username: ""
        # -- mailserver password
        password: ""
        # -- name of an existing secret containing an `smtp-password` key to use instead of the password above
        existingSecret: ""

  metrics:
    serviceMonitor:
      # -- if enabled, creates a ServiceMonitor instance for Prometheus Operator-based monitoring
      enabled: false
      # -- additional labels
      additionalLabels: {}
      # namespace: monitoring
      # interval: 30s
      # scrapeTimeout: 10s

  # -- specify extra environment vars on the container
  extraEnv: []

  # -- specify additional labels to apply to the list pod
  extraPodLabels: {}

  ingress:
    # -- if enabled, create an ingress resource to access list
    enabled: false
    # -- name of the IngressClass resource to use for this ingress
    ingressClassName: ""
    # -- additional annotations for the Ingress resource
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: list.127.0.0.1.nip.io
        paths:
          - "/"
    # -- TLS configuration
    tls: []
    #  - secretName: list-example-tls
    #    hosts:
    #      - list-example.local

  # -- set container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge). This is ignored if `resources` is set (`resources` is recommended for production).
  # More information: <https://github.com/miracum/charts/blob/master/charts/common/templates/_resources.tpl#L1>
  resourcesPreset: "small"

  # -- resource requests and limits for the container
  resources: {}

  # Configuration for the container's readiness probe. Set `enabled: false` to disable it.
  # See <https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/>
  # @ignore
  readinessProbe: # +doc-gen:ignore
    enabled: true
    httpGet:
      path: /readyz
      port: http
    failureThreshold: 3
    initialDelaySeconds: 20
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5
  # Configuration for the container's liveness probe. Set `enabled: false` to disable it.
  # See <https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/>
  # @ignore
  livenessProbe: # +doc-gen:ignore
    enabled: true
    httpGet:
      path: /livez
      port: http
    failureThreshold: 3
    initialDelaySeconds: 20
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5
  # Configuration for the container's startup probe. Set `enabled: false` to disable it. list
  # runs EF Core migrations and installs the Hangfire schema before it starts listening at all, so
  # this gives it a generous, one-time grace period to finish that instead of being judged against
  # livenessProbe's much tighter steady-state budget (which would otherwise risk killing the
  # container mid-migration on a slow first start).
  # See <https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/>
  # @ignore
  startupProbe: # +doc-gen:ignore
    enabled: true
    httpGet:
      path: /livez
      port: http
    failureThreshold: 30
    initialDelaySeconds: 10
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5

  # -- node labels for pod assignment
  # see: <https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/>
  nodeSelector: {}

  # -- tolerations for pod assignment
  # see: <https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/>
  tolerations: []

  # -- affinity for pod assignment
  # see: <https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity>
  affinity: {}

  # -- security context for the pod
  podSecurityContext: {}

  # -- pod topology spread configuration
  # see: <https://kubernetes.io/docs/concepts/workloads/pods/pod-topology-spread-constraints/#api>
  topologySpreadConstraints: []
    # - maxSkew: 1
    #   topologyKey: topology.kubernetes.io/zone
    #   whenUnsatisfiable: ScheduleAnyway
    #   labelSelector:
    #     matchLabels:
    #       app.kubernetes.io/component: list
    #       app.kubernetes.io/instance: recruit

  # -- security context for the container
  # @ignore
  securityContext: # +doc-gen:ignore
    privileged: false
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    # matches $APP_UID in the list Dockerfile's base image (mcr.microsoft.com/dotnet/aspnet)
    runAsUser: 1654
    runAsGroup: 1654
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault

  # -- extra volumes
  extraVolumes: []

  # -- extra volumes to mount inside the container
  extraVolumeMounts: []

querySqlOnFhir:
  # -- Whether the SQL-based query module (query-sql-on-fhir) should be enabled
  enabled: false
  # -- Number of replicas of the query module to run.
  # Running more than one replica for this component is discouraged.
  replicaCount: 1
  # -- specify how many old ReplicaSets for this Deployment you want to retain.
  revisionHistoryLimit: 5

  # the query module's image
  # @ignore
  image: # +doc-gen:ignore
    registry: ghcr.io
    repository: open-recruit/recruit/query-sql-on-fhir
    tag: v10.5.7 # x-release-please-version
    pullPolicy: IfNotPresent

  serviceAccount:
    # -- Specifies whether a service account should be created.
    create: false
    # -- Annotations to add to the service account
    annotations: {}
    # -- The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""
    # -- whether to automount the SA token.
    automountServiceAccountToken: false

  metrics:
    serviceMonitor:
      # -- if enabled, creates a ServiceMonitor instance for Prometheus Operator-based monitoring
      enabled: false
      # -- additional labels to apply the the ServiceMonitor object, eg. `release: prometheus`
      additionalLabels: {}
      # namespace: monitoring
      # interval: 30s
      # scrapeTimeout: 10s

  # -- extra environment vars on the container
  extraEnv: []

  # -- specify additional labels to apply to the query pod
  extraPodLabels: {}

  # -- the service used to expose the query module web port
  service:
    # -- the service type
    type: ClusterIP
    # -- the service port for the HTTP endpoint
    port: 8080
    # -- the service port for the actuator/metrics endpoint
    metricsPort: 8081

  # -- SQL dialect of the database the eligibility criteria's SQL is run against: `trino` (see `querySqlOnFhir.trino`)
  # or `duckdb` (an embedded, in-memory DuckDB, see `querySqlOnFhir.duckdb`). A criterion Library is run directly
  # if it has `application/sql;dialect=<sqlDialect>` content.
  sqlDialect: "trino"

  duckdb:
    # -- SQL run on every new DuckDB connection, typically to create the tables the criteria query as views over
    # the FHIR resources, e.g. `CREATE VIEW patient AS SELECT * FROM read_json('/data/fhir/Patient.ndjson');`.
    # Mount local files via `querySqlOnFhir.extraVolumes`/`extraVolumeMounts`. Only used if `sqlDialect=duckdb`.
    initSql: ""

  trino:
    # -- JDBC URL of the Trino server, e.g. `jdbc:trino://localhost:8080/fhir/default`
    #    the URL can optionally include the catalog and schema, whether this is necessary depends
    #    on how the SQL cohorts are written in the FHIR Library.
    jdbcUrl: ""
    auth:
      # -- the username to login as.
      username: ""
      # -- the password used for login.
      password: ""
      # -- use an existing secret to retrieve the login credentials from
      existingSecret:
        # -- name of an existing Kubernetes secret that contains the user password
        name: ""
        # -- the key containing the password
        key: "trino-password"

  sqlOnFhir:
    # -- base URL of a sql-on-fhir server (e.g. Pathling) implementing the SQLQueryRun operation,
    #    used for SQLQuery Library resources that depend on a ViewDefinition or use a SQL dialect
    #    other than trino. e.g. `http://pathling:8080/fhir`
    url: ""

  # -- a Spring cron expression defining the execution schedule of the query module
  schedule: "@hourly"

  # @ignore
  readinessProbe: # +doc-gen:ignore
    enabled: true
    httpGet:
      path: /readyz
      port: http
    failureThreshold: 5
    initialDelaySeconds: 30
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5

  # @ignore
  livenessProbe: # +doc-gen:ignore
    enabled: true
    httpGet:
      path: /livez
      port: http
    failureThreshold: 10
    initialDelaySeconds: 30
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 10

  # @ignore
  startupProbe: # +doc-gen:ignore
    enabled: true
    httpGet:
      path: /livez
      port: http
    failureThreshold: 10
    initialDelaySeconds: 30
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 10

  # -- set container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge). This is ignored if `resources` is set (`resources` is recommended for production).
  # More information: <https://github.com/miracum/charts/blob/master/charts/common/templates/_resources.tpl#L1>
  resourcesPreset: "medium"

  # -- resource requests and limits for the container
  resources: {}

  # -- node labels for pod assignment
  # see: <https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/>
  nodeSelector: {}

  # -- tolerations for pod assignment
  # see: <https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/>
  tolerations: []

  # -- affinity for pod assignment
  # see: <https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity>
  affinity: {}

  # -- security context for the pod
  podSecurityContext: {}

  # -- security context for the container
  # @ignore
  securityContext: # +doc-gen:ignore
    privileged: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault

  # -- pod topology spread configuration
  # see: <https://kubernetes.io/docs/concepts/workloads/pods/pod-topology-spread-constraints/#api>
  topologySpreadConstraints: []
    # - maxSkew: 1
    #   topologyKey: topology.kubernetes.io/zone
    #   whenUnsatisfiable: ScheduleAnyway
    #   labelSelector:
    #     matchLabels:
    #       app.kubernetes.io/component: query-sql-on-fhir
    #       app.kubernetes.io/instance: recruit

  # -- extra volumes
  extraVolumes: []

  # -- extra volumes to mount inside the container
  extraVolumeMounts: []

postgres:
  # -- enable the included postgres DB. Used by the list module unless `list.database.connectionString`
  # is set.
  enabled: true
  # -- override the default name to avoid conflicts with the HAPI FHIR server chart
  nameOverride: "recruit-postgres"
  auth:
    # -- set the default database name to `recruit`
    database: "recruit"

grafanaDashboard:
  # -- if enabled, creates a ConfigMap with recruIT's Grafana dashboard (see `files/dashboards/recruit.json`)
  # for Grafana's dashboard sidecar to load, as included in kube-prometheus-stack. Needs the metrics of
  # `list` and `querySqlOnFhir` scraped, e.g. via their `metrics.serviceMonitor`.
  enabled: false
  # -- labels the dashboard sidecar looks for. `grafana_dashboard: "1"` is the sidecar's default.
  labels:
    grafana_dashboard: "1"
  # -- annotations, e.g. `grafana_folder: recruIT` to put it in a folder if the sidecar's
  # `folderAnnotation` is set to `grafana_folder`
  annotations: {}
  # -- namespace to create the ConfigMap in, if the sidecar only watches some namespaces. Defaults to the
  # release namespace.
  namespace: ""

# @ignore
curl: # +doc-gen:ignore
  image:
    registry: docker.io
    repository: curlimages/curl
    tag: 8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777

# kubectl image used by the wait-for-migration initContainer to poll the list migration Job's
# status. Needs a shell (the initContainer's poll loop runs as a /bin/sh script), which rules out
# minimal/distroless kubectl images that ship only the binary.
# @ignore
kubectl: # +doc-gen:ignore
  image:
    registry: docker.io
    repository: alpine/k8s
