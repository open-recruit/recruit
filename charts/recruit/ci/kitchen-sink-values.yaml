# the only values file `ct install` installs in CI: each additional one costs several minutes,
# so new settings worth testing go here instead of into a new file.

# the probe delays and polling intervals below are much shorter than the defaults, which leave
# plenty of headroom for slow production clusters. In kind, every component is up within seconds,
# so the defaults only add up to minutes of waiting between the components' startups.

podAnnotations:
  linkerd.io/inject: "enabled"

list:
  podDisruptionBudget:
    enabled: true
  notifications:
    testing:
      enabled: true
  replicaCount: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: recruit
          app.kubernetes.io/instance: recruit
          app.kubernetes.io/component: list
  ingress:
    enabled: true
    hosts:
      - host: recruit-list.127.0.0.1.nip.io
        paths:
          - "/"
  metrics:
    serviceMonitor:
      enabled: false
      additionalLabels:
        release: kube-prom-stack
  extraEnv:
    - name: LOG_LEVEL
      value: "debug"
  migrationJob:
    waitPollIntervalSeconds: 2
  startupProbe:
    initialDelaySeconds: 0
    periodSeconds: 2
    failureThreshold: 150

postgres:
  enabled: true
  service:
    annotations:
      config.linkerd.io/opaque-ports: "5432"
  startupProbe:
    initialDelaySeconds: 0
    periodSeconds: 2
    failureThreshold: 150
  readinessProbe:
    initialDelaySeconds: 0
    periodSeconds: 2

fhirserver:
  resourcesPreset: "none"
  replicaCount: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: fhirserver
          app.kubernetes.io/instance: recruit
  ingress:
    enabled: true
    hosts:
      - host: recruit-fhir-server.127.0.0.1.nip.io
        pathType: ImplementationSpecific
        paths: ["/"]
  postgres:
    auth:
      # kics-scan ignore-line
      password: fhir
    service:
      annotations:
        config.linkerd.io/opaque-ports: "5432"
    startupProbe:
      initialDelaySeconds: 0
      periodSeconds: 2
      failureThreshold: 150
    readinessProbe:
      initialDelaySeconds: 0
      periodSeconds: 2
  podAnnotations:
    linkerd.io/inject: "enabled"
  metrics:
    serviceMonitor:
      enabled: false
      additionalLabels:
        release: kube-prom-stack
  startupProbe:
    initialDelaySeconds: 10
    periodSeconds: 3
    failureThreshold: 100
  readinessProbe:
    initialDelaySeconds: 0
    periodSeconds: 5

maildev:
  podAnnotations:
    linkerd.io/inject: "enabled"
