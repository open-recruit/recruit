apiVersion: v2
name: recruit
type: application
description: Helm chart for deploying the MIRACUM recruitment infrastructure on Kubernetes.
home: https://open-recruit.github.io/recruit
keywords:
  - miracum
  - fhir
  - clinical trials
  - patient recruitment
  - ctrss
maintainers:
  - name: chgl
sources:
  - https://github.com/open-recruit/recruit/tree/master/charts/recruit
deprecated: false
kubeVersion: ">= 1.30.0"
icon: https://open-recruit.github.io/recruit/_img/miracum-recruit-k8s-logo.png
dependencies:
  - condition: fhirserver.enabled
    alias: fhirserver
    name: hapi-fhir-jpaserver
    repository: https://hapifhir.github.io/hapi-fhir-jpaserver-starter
    version: 0.24.0
  - condition: maildev.enabled
    name: maildev
    repository: https://maildev.github.io/helm/
    version: 0.2.0
  - name: postgres
    version: 0.21.2
    repository: oci://registry-1.docker.io/cloudpirates
    condition: postgres.enabled
  - name: common
    repository: oci://ghcr.io/miracum/charts
    version: 0.2.0
version: 10.5.7 # x-release-please-version
appVersion: 10.5.7 # x-release-please-version
annotations:
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/license: AGPL-3.0-or-later
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/helm/prometheus-community/kube-prometheus-stack
    - url: https://artifacthub.io/packages/helm/cloudpirates-postgres/postgres
    - url: https://artifacthub.io/packages/helm/chgl/fhir-server-exporter
    - url: https://artifacthub.io/packages/helm/jaegertracing/jaeger
  artifacthub.io/links: |
    - name: Deployment Instructions
      url: https://open-recruit.github.io/recruit/deployment/kubernetes/
  artifacthub.io/screenshots: |
    - title: Screening list overview
      url: https://open-recruit.github.io/recruit/_img/atlas-first-cohort/list-overview-with-test-study.png
    - title: Screening recommendations for a test study
      url: https://open-recruit.github.io/recruit/_img/atlas-first-cohort/list-test-study.png
  artifacthub.io/changes: |-
    - kind: changed
      description: updated recruIT image tags to v10.5.7 # x-release-please-version
    - kind: changed
      description: dropped all bitnami charts and images
