{{- with .Values.list -}}
{{- if .enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" $ }}-list
  labels:
    {{- include "recruit.labels" $ | nindent 4 }}
    app.kubernetes.io/component: list
  {{- with $.Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .replicaCount }}
  revisionHistoryLimit: {{ .revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" $ | nindent 6 }}
      app.kubernetes.io/component: list
  template:
    metadata:
      labels:
        {{- include "common.labels.matchLabels" $ | nindent 8 }}
        app.kubernetes.io/component: list
        {{- with .extraPodLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .podSecurityContext | nindent 8 }}
      serviceAccountName: {{ include "recruit.serviceAccountName" (dict "context" . "component" "list" "root" $) }}
      automountServiceAccountToken: {{ .serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .terminationGracePeriodSeconds }}
      initContainers:
        - name: wait-for-migration
          image: {{ include "recruit.kubectl.image" $ }}
          imagePullPolicy: IfNotPresent
          {{- with $.Values.restrictedContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: JOB_NAME
              value: {{ include "recruit.list.migrationJobName" $ }}
            - name: NAMESPACE
              value: {{ $.Release.Namespace }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              i=0
              max_attempts={{ .migrationJob.waitMaxAttempts }}
              while true; do
                phase="$(kubectl get job "$JOB_NAME" -n "$NAMESPACE" \
                  -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}:{.status.conditions[?(@.type=="Failed")].status}')"
                complete="${phase%%:*}"
                failed="${phase##*:}"
                if [ "$complete" = "True" ]; then
                  echo "$(date): migration Job $JOB_NAME completed.";
                  exit 0
                fi
                if [ "$failed" = "True" ]; then
                  echo "$(date): migration Job $JOB_NAME failed - see 'kubectl logs job/$JOB_NAME -n $NAMESPACE'.";
                  exit 1
                fi
                i=$((i + 1))
                if [ "$i" -ge "$max_attempts" ]; then
                  echo "$(date): timed out waiting for migration Job $JOB_NAME to complete.";
                  exit 1
                fi
                echo "$(date): Waiting for migration Job $JOB_NAME to complete ($i/$max_attempts)";
                sleep {{ .migrationJob.waitPollIntervalSeconds }};
              done
          volumeMounts:
            - name: wait-for-migration-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
        - name: wait-for-fhir-server
          image: {{ include "recruit.curl.image" $ }}
          imagePullPolicy: IfNotPresent
          {{- with $.Values.restrictedContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: FHIR_SERVER_BASE_URL
              value: {{ include "recruit.fhirserver.url" $ }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              until [ "$(curl -s -o /dev/null -L -w '%{http_code}' "$FHIR_SERVER_BASE_URL/metadata")" == "200" ]; do
                echo "$(date): Waiting for FHIR server @ $FHIR_SERVER_BASE_URL to be up";
                sleep 5;
              done;
      containers:
        - name: list
          image: "{{ .image.registry }}/{{ .image.repository }}:{{ .image.tag }}"
          securityContext:
            {{- toYaml .securityContext | nindent 12 }}
          imagePullPolicy: {{ .image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: http-metrics
              containerPort: 8081
              protocol: TCP
          {{- if .lifecycle.enabled }}
          lifecycle:
            {{- include "common.tplvalues.render" (dict "value" (omit .lifecycle "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- if .livenessProbe.enabled }}
          livenessProbe:
            {{- include "common.tplvalues.render" (dict "value" (omit .livenessProbe "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- if .readinessProbe.enabled }}
          readinessProbe:
            {{- include "common.tplvalues.render" (dict "value" (omit .readinessProbe "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- if .startupProbe.enabled }}
          startupProbe:
            {{- include "common.tplvalues.render" (dict "value" (omit .startupProbe "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- if .resources }}
          resources: {{- toYaml .resources | nindent 12 }}
          {{- else if ne .resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" .resourcesPreset) | nindent 12 }}
          {{- end }}
          env:
            - name: FhirServer__BaseUrl
              value: {{ include "recruit.fhirserver.url" $ }}
            - name: Auth__Enabled
              value: {{ .auth.enabled | toString | quote }}
            {{- if .auth.enabled }}
            - name: Auth__Oidc__Authority
              value: {{ .auth.oidc.authority | quote }}
            - name: Auth__Oidc__ClientId
              value: {{ .auth.oidc.clientId | quote }}
            - name: Auth__Oidc__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: {{ include "recruit.list.oidc.secretName" $ }}
                  key: {{ include "recruit.list.oidc.secretKey" $ }}
            - name: Auth__Oidc__RoleClaimType
              value: {{ .auth.oidc.roleClaimType | quote }}
            {{- end }}
            - name: ConnectionStrings__AppDb
              value: {{ include "recruit.list.database.connectionString" $ }}
            {{- with (include "recruit.list.database.username" $) }}
            - name: PGUSER
              value: {{ . | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "recruit.list.database.secretName" $ }}
                  key: {{ include "recruit.list.database.secretKey" $ }}
            {{- end }}
            - name: Notifications__StalledLeadWindowDays
              value: {{ .notifications.stalledLeadWindowDays | quote }}
            - name: Notifications__ScanIntervalSeconds
              value: {{ .notifications.scanIntervalSeconds | quote }}
            - name: Notifications__Testing__Enabled
              value: {{ .notifications.testing.enabled | quote }}
            - name: Notifications__Email__PublicBaseUrl
              value: {{ include "recruit.list.publicBaseUrl" $ }}
            - name: Notifications__Email__From
              value: {{ .notifications.email.from | quote }}
            - name: Notifications__Email__SubjectTemplate
              value: {{ .notifications.email.subjectTemplate | quote }}
            - name: Notifications__Email__SmtpHost
              {{- if $.Values.maildev.enabled }}
              value: {{ printf "%s-smtp" (include "recruit.maildev.fullname" $) }}
              {{- else }}
              value: {{ .notifications.email.smtp.host | quote }}
              {{- end }}
            - name: Notifications__Email__SmtpPort
              {{- if $.Values.maildev.enabled }}
              value: {{ $.Values.maildev.ports.smtp | quote }}
              {{- else }}
              value: {{ .notifications.email.smtp.port | quote }}
              {{- end }}
            - name: Notifications__Email__SmtpUsername
              {{- if $.Values.maildev.enabled }}
              value: ""
              {{- else }}
              value: {{ .notifications.email.smtp.username | quote }}
              {{- end }}
            - name: Notifications__Email__SmtpPassword
              valueFrom:
                secretKeyRef:
                  name: {{ include "recruit.list.mail.secretName" $ }}
                  key: smtp-password
            {{- if .extraEnv }}
            {{ toYaml .extraEnv | nindent 12 }}
            {{- end }}
          volumeMounts:
            - mountPath: /tmp
              name: tmp-volume
          {{- if .extraVolumeMounts }}
            {{- toYaml .extraVolumeMounts | nindent 12 }}
          {{- end }}
      {{- with .nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: wait-for-migration-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3607
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
      {{- if .extraVolumes }}
        {{- toYaml .extraVolumes | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
