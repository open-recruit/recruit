{{- if and .Values.sampleStudy.enabled (or .Values.fhirserver.enabled (ne .Values.externalFhirServer.url "")) -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "common.names.fullname" . }}-sample-study
  labels:
    {{- include "recruit.labels" . | nindent 4 }}
    app.kubernetes.io/component: sample-study
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    # after the SearchParameters
    "helm.sh/hook-weight": "2"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.sampleStudy.backoffLimit }}
  {{- with .Values.sampleStudy.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ . }}
  {{- end }}
  template:
    metadata:
      {{- with .Values.sampleStudy.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "recruit.labels" . | nindent 8 }}
        app.kubernetes.io/component: sample-study
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-fhir-server
          image: {{ include "recruit.curl.image" . }}
          imagePullPolicy: IfNotPresent
          {{- with .Values.restrictedContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.sampleStudy.resources }}
          resources: {{- toYaml .Values.sampleStudy.resources | nindent 12 }}
          {{- else if ne .Values.sampleStudy.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" .Values.sampleStudy.resourcesPreset) | nindent 12 }}
          {{- end }}
          env:
            - name: FHIR_SERVER_BASE_URL
              value: {{ include "recruit.fhirserver.url" . }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              until [ "$(curl -s -o /dev/null -L -w '%{http_code}' "$FHIR_SERVER_BASE_URL/metadata")" == "200" ]; do
                echo "$(date): Waiting for FHIR server to be up";
                sleep 5;
              done;
      containers:
        - name: sample-study
          image: {{ include "recruit.curl.image" . }}
          imagePullPolicy: IfNotPresent
          {{- with .Values.restrictedContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.sampleStudy.resources }}
          resources: {{- toYaml .Values.sampleStudy.resources | nindent 12 }}
          {{- else if ne .Values.sampleStudy.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" .Values.sampleStudy.resourcesPreset) | nindent 12 }}
          {{- end }}
          env:
            - name: FHIR_SERVER_BASE_URL
              value: {{ include "recruit.fhirserver.url" . }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              echo "Installing the sample ResearchStudy on $FHIR_SERVER_BASE_URL..."
              curl --fail-with-body --retry 5 --retry-delay 5 --retry-connrefused --retry-all-errors \
                -X POST \
                -H "Content-Type: application/fhir+json" \
                --data @/fhir/sample-study-transaction-upsert.json \
                "$FHIR_SERVER_BASE_URL"
          volumeMounts:
            - name: sample-study
              mountPath: /fhir
              readOnly: true
      volumes:
        - name: sample-study
          configMap:
            name: {{ include "common.names.fullname" . }}-sample-study
{{- end -}}
