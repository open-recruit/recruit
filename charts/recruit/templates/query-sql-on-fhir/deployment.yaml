{{- with .Values.querySqlOnFhir -}}
{{- if .enabled -}}
{{- $syntheticPatients := and $.Values.syntheticPatients.enabled (eq .sqlDialect "duckdb") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" $ }}-query-sql-on-fhir
  labels:
    {{- include "recruit.labels" $ | nindent 4 }}
    app.kubernetes.io/component: query-sql-on-fhir
  {{- with $.Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .replicaCount }}
  revisionHistoryLimit: {{ .revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" $ | nindent 6 }}
      app.kubernetes.io/component: query-sql-on-fhir
  template:
    metadata:
      labels:
        {{- include "common.labels.matchLabels" $ | nindent 8 }}
        app.kubernetes.io/component: query-sql-on-fhir
        {{- with .extraPodLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .podSecurityContext | nindent 8 }}
      serviceAccountName: {{ include "recruit.serviceAccountName" (dict "context" . "component" "query-sql-on-fhir" "root" $) }}
      automountServiceAccountToken: {{ .serviceAccount.automountServiceAccountToken }}
      initContainers:
        # TODO: wait for trino to be up
        - name: wait-for-fhir-server
          image: {{ include "recruit.curl.image" $ }}
          imagePullPolicy: IfNotPresent
          {{- with $.Values.restrictedContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: FHIR_SERVER_BASE_URL
              value: {{ include "recruit.fhirserver.url" $ }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              until [ "$(curl -s -o /dev/null -L -w '%{http_code}' "$FHIR_SERVER_BASE_URL/metadata")" == "200" ]; do
                echo "$(date): Waiting for FHIR server @ $FHIR_SERVER_BASE_URL to be up";
                sleep 5;
              done;
        {{- if $syntheticPatients }}
        # the same patients the synthetic patients Job loads into the FHIR server, as NDJSON files in /data/fhir/ to
        # be queried via DuckDB
        {{- include "recruit.syntheticPatients.generateContainer" (dict "root" $ "exporterArgs" "") | nindent 8 }}
        {{- end }}
      containers:
        - name: query-sql-on-fhir
          image: "{{ .image.registry }}/{{ .image.repository }}:{{ .image.tag }}"
          securityContext:
            {{- toYaml .securityContext | nindent 12 }}
          imagePullPolicy: {{ .image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: http-metrics
              containerPort: 8081
              protocol: TCP
          {{- if .livenessProbe.enabled }}
          livenessProbe:
            {{- include "common.tplvalues.render" (dict "value" (omit .livenessProbe "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- if .readinessProbe.enabled }}
          readinessProbe:
            {{- include "common.tplvalues.render" (dict "value" (omit .readinessProbe "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- if .startupProbe.enabled }}
          startupProbe:
            {{- include "common.tplvalues.render" (dict "value" (omit .startupProbe "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- if .resources }}
          resources: {{- toYaml .resources | nindent 12 }}
          {{- else if ne .resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" .resourcesPreset) | nindent 12 }}
          {{- end }}
          env:
            - name: FHIR_SERVER_BASE_URL
              value: {{ include "recruit.fhirserver.url" $ }}
            - name: QUERY_SQL_ON_FHIR_SQL_DIALECT
              value: {{ .sqlDialect | quote }}
            {{- if eq .sqlDialect "duckdb" }}
            # every connection is its own, empty in-memory database, set up by the init SQL. DuckDB spills
            # to `.tmp` in the working directory by default, which is on the read-only root filesystem.
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:duckdb:;temp_directory=/tmp/duckdb"
            - name: SPRING_DATASOURCE_DRIVERCLASSNAME
              value: org.duckdb.DuckDBDriver
            {{- with .duckdb.initSql }}
            - name: SPRING_DATASOURCE_HIKARI_CONNECTIONINITSQL
              value: {{ tpl . $ | quote }}
            {{- end }}
            {{- else }}
            - name: SPRING_DATASOURCE_URL
              value: {{ include "recruit.trino.jdbcUrl" $ | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .trino.auth.username | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "recruit.trino.secret.name" $ }}
                  key: {{ include "recruit.trino.secret.key" $ }}
            {{- end }}
            - name: QUERY_SQL_ON_FHIR_SCHEDULE_CRON
              value: {{ .schedule | quote }}
            - name: SQL_ON_FHIR_URL
              value: {{ .sqlOnFhir.url | quote }}
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ADD_ADDITIONAL_PATHS
              value: "true"
            - name: MANAGEMENT_SERVER_PORT
              value: "8081"
            {{- if .extraEnv }}
            {{ toYaml .extraEnv | nindent 12 }}
            {{- end }}
          volumeMounts:
            - mountPath: /tmp
              name: tmp-volume
            {{- if $syntheticPatients }}
            - mountPath: /data
              name: synthetic-patients
              readOnly: true
            {{- end }}
          {{- if .extraVolumeMounts }}
            {{- toYaml .extraVolumeMounts | nindent 12 }}
          {{- end }}
      {{- with .nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      volumes:
        - name: tmp-volume
          emptyDir: {}
        {{- if $syntheticPatients }}
        {{- include "recruit.syntheticPatients.volumes" $ | nindent 8 }}
        {{- end }}
      {{- if .extraVolumes }}
        {{- toYaml .extraVolumes | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
